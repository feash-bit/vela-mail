[package]
name = "vela-mail"
version = "0.1.0"
description = "Vela — a fast, keyboard-first Gmail desktop client"
edition = "2021"
license = "MIT"
default-run = "vela-mail"

[lib]
name = "vela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vela-mail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros", "rt-multi-thread"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
url = "2"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Secrets: system keyring via the freedesktop Secret Service (KWallet / GNOME Keyring)
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Crypto helpers for OAuth PKCE and random tokens
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Email content
ammonia = "4"
mail-builder = "0.4"
encoding_rs = "0.8"
linkify = "0.10"
regex = "1"
mime_guess = "2"

# Local cache
rusqlite = { version = "0.32", features = ["bundled"] }

# Desktop notifications over D-Bus
notify-rust = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
